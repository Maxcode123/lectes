site_name: lectes
site_url: https://maximosnikiforakis.gr/lectes/
repo_url: https://github.com/Maxcode123/lectes
repo_name: Maxcode123/lectes
nav:
  - Get started:
    - What is lectes?: index.md
    - Installation: installation.md
    - Usage: usage.md
    - Command line: cli.md
    - Playground: https://lectes.dev

  - API Documentation:
    - config: config.md
    - scanner: scanner.md
 
theme:
  name: material
  font: false
  logo: assets/favicon.svg
  favicon: assets/favicon.svg
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.path
    - content.code.copy
  # Dark only, like the lectes.dev playground: arcade.css maps slate's colours
  # onto the arcade palette.
  palette:
    scheme: slate
    primary: custom
    accent: custom
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/arcade.css

plugins:
- mkdocstrings
- search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
